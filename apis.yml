  detail: >-
    The only Agrolend API host, parceiro.agrolend.agr.br, sits behind blanket HTTP Basic auth and
    returns 401 with WWW-Authenticate: Basic on every path including /v3/api-docs and /openapi.json,
    while the docs.agrolend.agr.br and portal.agrolend.agr.br subdomains that would have carried the
    reference have been dead since their wildcard certificate expired on 2025-03-06 and now return
    504 from an empty load balancer.
