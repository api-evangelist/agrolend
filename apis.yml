aid: agrolend
name: Agrolend
description: >-
  Agrolend is a Brazilian agricultural-credit fintech — legally Agrolend Sociedade de Credito,
  Financiamento e Investimento S/A (CNPJ 43.774.196/0001-84), a Banco Central do Brasil regulated
  SCFI headquartered in Sao Paulo. Founded in 2020, it originates working capital, receivables
  discount, liability-extension and inter-chain credit for small and mid-sized rural producers,
  distributing through agricultural retailers, cooperatives and input industries rather than direct
  to farm, and funds the book partly through FGC-covered LCA notes sold on third-party investment
  platforms. Its stated differentiator is a cloud-native, AI-assisted credit engine that underwrites
  without requiring farm or grain collateral. Agrolend publishes no developer portal, no API
  reference and no machine-readable contract; the only API surface reachable from the public
  internet is the partner-area backend at parceiro.agrolend.agr.br, which answers HTTP Basic 401 on
  every path.
