  every commercial conversation through the partner registration form at
  https://agrolend.agr.br/seja-nosso-parceiro/. There is no API product and therefore no API pricing
  of any kind. The only quantitative figures published are volume statistics - R$2 bilhoes granted,
  300 corporate clients, 10 mil producers - which are traction numbers, not a price list.
