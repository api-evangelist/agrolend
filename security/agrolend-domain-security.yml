    backend is healthy. Dead infrastructure still holding a DNS name and an expired certificate.
- host: portal.agrolend.agr.br
  role: abandoned portal host
  https: true
  tls_version: TLSv1.2
  cert_subject: CN=*.agrolend.agr.br
  cert_expires: '2025-03-06'
