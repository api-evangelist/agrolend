  tls_version: TLSv1.2
  cert_subject: CN=*.agrolend.agr.br
  cert_expires: '2025-03-06'
  cert_expired: true
  hsts: false
  http_status: 504
  note: >-
    Resolves to agrolend-alb-dmz-apps-980323442.us-east-1.elb.amazonaws.com and serves a wildcard
